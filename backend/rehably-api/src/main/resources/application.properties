spring.application.name=rehably-api
server.port=${PORT:8081}

# Primary runtime: MySQL. Set environment variables before starting the app when using a local database.
# Example:
#   DB_URL=jdbc:mysql://localhost:3306/rehably_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
#   DB_USERNAME=root
#   DB_PASSWORD=your_password
#   DB_DRIVER=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rehably_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:rehably}
spring.datasource.password=${DB_PASSWORD:rehably123}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

server.servlet.session.cookie.name=REHABLY_SESSION
server.servlet.session.timeout=30m

# Optional local fallback for quick bootstrapping without MySQL.
# Example override:
#   DB_URL=jdbc:h2:mem:rehably;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
#   DB_USERNAME=sa
#   DB_PASSWORD=
#   DB_DRIVER=org.h2.Driver
#   HIBERNATE_DIALECT=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.web.resources.static-locations=classpath:/static/,file:../,file:../../

logging.level.org.springframework.security=INFO
