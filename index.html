<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareBridge Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --primary: #839958; --secondary: #d39683; --text: #0a3323; --bg: #f7f4d5; --white: #ffffff; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f5f0dc 0%, #e6efdf 100%); color: var(--text); min-height: 100vh; display: grid; place-items: center; }
        .login-shell { width: min(1100px, 92vw); display: grid; grid-template-columns: 1.2fr 0.8fr; background: rgba(255,255,255,0.72); border: 2px solid var(--primary); box-shadow: 0 25px 60px rgba(10,51,35,0.12); overflow: hidden; }
        .login-visual { min-height: 620px; background: url('image.jpg') center/cover no-repeat; position: relative; padding: 60px; display: flex; align-items: flex-end; }
        .login-overlay { background: rgba(10, 51, 35, 0.45); padding: 28px 30px; max-width: 420px; color: #f5f0de; border: 1px solid rgba(255,255,255,0.2); }
        .login-overlay h1 { font-family: 'Playfair Display', serif; font-size: clamp(42px, 4vw, 62px); line-height: 1.05; margin-bottom: 16px; }
        .login-overlay p { font-size: 18px; line-height: 1.7; }
        .login-card { background: var(--white); padding: 54px 42px; display: flex; flex-direction: column; justify-content: center; }
        .logo { font-family: 'Playfair Display', serif; font-size: 34px; color: var(--primary); font-weight: 700; margin-bottom: 22px; }
        .login-card h2 { font-family: 'Playfair Display', serif; font-size: 38px; margin-bottom: 8px; }
        .login-card p { color: #3a4f44; margin-bottom: 28px; }
        form { display: grid; gap: 18px; }
        label { font-size: 13px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--text); }
        input { width: 100%; padding: 15px 16px; border: 2px solid #d7dcc0; background: #f9f9f3; font-size: 15px; color: var(--text); outline: none; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(131,153,88,0.18); }
        button { border: none; background: var(--primary); color: var(--white); padding: 16px 20px; font-size: 15px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; cursor: pointer; transition: background 0.2s ease; }
        button:hover { background: #6b8045; }
        .error-message { min-height: 24px; color: #9f2f2f; font-size: 14px; font-weight: 600; }
        .demo-box { margin-top: 28px; padding: 18px 20px; background: var(--bg); border-left: 4px solid var(--secondary); }
        .demo-box strong { display: inline-block; min-width: 95px; }
        .demo-box p { margin: 0; line-height: 1.8; font-size: 14px; }
        @media (max-width: 860px) { .login-shell { grid-template-columns: 1fr; } .login-visual { min-height: 360px; } .login-card { padding: 42px 28px; } }
    </style>
</head>
<body>
    <main class="login-shell">
        <section class="login-visual">
            <div class="login-overlay">
                <h1>Professional Physiotherapy Care</h1>
                <p>Recover faster, move with confidence, and access personalised rehabilitation support designed around your wellbeing.</p>
            </div>
        </section>
        <section class="login-card">
            <div class="logo">CareBridge</div>
            <h2>Welcome back</h2>
            <p>Sign in to continue to your dashboard.</p>
            <form id="loginForm">
                <div>
                    <label for="username">Username</label>
                    <input id="username" name="username" type="text" autocomplete="username" required>
                </div>
                <div>
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <button type="submit">Login</button>
                <div id="errorMessage" class="error-message" aria-live="polite"></div>
            </form>
            <div class="demo-box">
                <p><strong>Patient:</strong> patient / 1234</p>
                <p><strong>Doctor:</strong> doctor / 123</p>
            </div>
        </section>
    </main>
    <script>
        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');

        async function redirectIfLoggedIn() {
            try {
                const response = await fetch('/api/auth/me', { credentials: 'include' });
                if (response.ok) {
                    const user = await response.json();
                    window.location.href = user.dashboard === 'patient-home.html' ? 'patient-home.html' : 'doctor-dashboard.html';
                }
            } catch (err) {
                errorMessage.textContent = 'Cannot reach the sign-in service. Please start the backend and try again.';
            }
        }

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorMessage.textContent = '';
            const submitButton = loginForm.querySelector('button[type="submit"]');
            submitButton.disabled = true;
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                if (!response.ok) {
                    errorMessage.textContent = 'Incorrect username or password. Please try again.';
                    return;
                }
                const user = await response.json();
                window.location.href = user.dashboard === 'patient-home.html' ? 'patient-home.html' : 'doctor-dashboard.html';
            } catch (err) {
                errorMessage.textContent = 'Cannot reach the sign-in service. Please start the backend and try again.';
            } finally {
                submitButton.disabled = false;
            }
        });

        redirectIfLoggedIn();
    </script>
</body>
</html>
