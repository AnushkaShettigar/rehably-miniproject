<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Appointments | CareBridge</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --primary: #839958; --secondary: #d39683; --text: #0a3323; --bg: #f7f4d5; --white: #ffffff; }
        body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--white); }
        .navbar { height: 80px; display: flex; align-items: center; justify-content: space-between; padding: 0 60px; background: var(--white); border-bottom: 3px solid var(--secondary); }
        .logo { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 700; color: var(--primary); }
        .nav-links { display: flex; gap: 30px; list-style: none; }
        .nav-links a { text-decoration: none; color: var(--text); font-size: 14px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
        .nav-links a:hover { color: var(--primary); }
        .page-header { background: url('image.jpg') center/cover no-repeat; padding: 80px 60px; text-align: center; }
        .page-header h1 { font-family: 'Playfair Display', serif; font-size: 52px; color: #f5f0de; margin-bottom: 12px; }
        .page-header p { color: #f5f0de; font-size: 18px; }
        .content-wrap { max-width: 1100px; margin: 0 auto; padding: 60px 24px 100px; }
        .appointment-list { display: grid; gap: 18px; }
        .appointment-card { background: var(--bg); border-left: 5px solid var(--secondary); padding: 24px; }
        .appointment-card h3 { font-family: 'Playfair Display', serif; font-size: 28px; margin-bottom: 8px; }
        .appointment-card p { margin: 6px 0; font-size: 14px; line-height: 1.7; }
        .status-pill { display: inline-block; margin-top: 14px; padding: 6px 10px; background: var(--primary); color: var(--white); font-size: 10px; font-weight: 700; letter-spacing: 0.7px; text-transform: uppercase; }
        .empty-state { display: none; text-align: center; color: #4f695d; padding: 40px; background: #f6f5e8; border: 2px dashed #b7c29d; }
        .logout-button { background: transparent; border: 1px solid var(--secondary); color: var(--text); padding: 10px 18px; cursor: pointer; }
        .logout-button:hover { background: var(--secondary); color: var(--white); }
        @media (max-width: 700px) { .navbar { padding: 0 30px; height: 60px; } .nav-links { gap: 14px; } .nav-links a { font-size: 11px; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">CareBridge</div>
        <ul class="nav-links">
            <li><a href="patient-home.html">Home</a></li>
            <li><a href="services.html">Doctors</a></li>
            <li><a href="resources.html">Exercises</a></li>
        </ul>
        <button class="logout-button" id="logoutButton" type="button">Logout</button>
    </nav>
    <header class="page-header">
        <h1>My Appointments</h1>
        <p>Track your appointment requests and their latest status.</p>
    </header>
    <main class="content-wrap">
        <div id="emptyState" class="empty-state">You do not have any appointment requests yet.</div>
        <div id="appointmentList" class="appointment-list"></div>
    </main>
    <script>
        const appointmentList = document.getElementById('appointmentList');
        const emptyState = document.getElementById('emptyState');

        async function ensurePatientAccess() {
            const response = await fetch('/api/auth/me', { credentials: 'include' });
            if (!response.ok) { window.location.href = 'index.html'; return false; }
            const user = await response.json();
            if (user.role !== 'PATIENT') { window.location.href = 'doctor-dashboard.html'; return false; }
            return true;
        }

        async function loadAppointments() {
            const allowed = await ensurePatientAccess();
            if (!allowed) return;
            const response = await fetch('/api/appointment-requests/my', { credentials: 'include' });
            if (!response.ok) {
                appointmentList.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }
            const appointments = await response.json();
            if (!appointments.length) {
                emptyState.style.display = 'block';
                appointmentList.innerHTML = '';
                return;
            }
            emptyState.style.display = 'none';
            appointmentList.innerHTML = appointments.map((appointment) => `
                <article class="appointment-card">
                    <h3>${appointment.specialty}</h3>
                    <p><strong>Doctor:</strong> ${appointment.doctorName}</p>
                    <p><strong>Reason:</strong> ${appointment.consultationReason}</p>
                    <p><strong>Preferred date and time:</strong> ${appointment.preferredDate || 'Not specified'} ${appointment.preferredTime ? 'at ' + appointment.preferredTime : ''}</p>
                    <p><strong>Notes:</strong> ${appointment.notes || 'No additional notes provided'}</p>
                    <p><strong>Submitted:</strong> ${new Date(appointment.submittedAt).toLocaleString()}</p>
                    <span class="status-pill">${appointment.status}</span>
                </article>
            `).join('');
        }

        document.getElementById('logoutButton').addEventListener('click', async () => {
            await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
            window.location.href = 'index.html';
        });

        loadAppointments();
    </script>
</body>
</html>
