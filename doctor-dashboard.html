<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doctor Dashboard | CareBridge</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --primary: #839958; --secondary: #d39683; --text: #0a3323; --bg: #f7f4d5; --white: #ffffff; }
        body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--white); }
        .navbar { height: 80px; display: flex; align-items: center; justify-content: space-between; padding: 0 60px; background: var(--white); border-bottom: 3px solid var(--secondary); }
        .logo { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 700; color: var(--primary); }
        .nav-links { display: flex; gap: 32px; list-style: none; }
        .nav-links a { text-decoration: none; color: var(--text); font-size: 14px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
        .nav-links a:hover { color: var(--primary); }
        .page-header { background: url('image.jpg') center/cover no-repeat; padding: 80px 60px; text-align: center; }
        .page-header h1 { font-family: 'Playfair Display', serif; font-size: 52px; color: #f5f0de; margin-bottom: 12px; }
        .page-header p { color: #f5f0de; font-size: 18px; }
        .dashboard-wrap { max-width: 1180px; margin: 0 auto; padding: 60px 24px 90px; }
        .overview { background: var(--bg); border-left: 5px solid var(--primary); padding: 24px 28px; margin-bottom: 28px; }
        .overview h2 { font-family: 'Playfair Display', serif; font-size: 32px; margin-bottom: 8px; }
        .overview p { color: #4d6456; }
        .request-list { display: grid; gap: 18px; }
        .request-card { background: #f9f9f3; border: 1px solid #dfe6d5; padding: 22px; }
        .request-top { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 12px; }
        .request-top h3 { font-family: 'Playfair Display', serif; font-size: 28px; }
        .status-pill { display: inline-flex; padding: 8px 12px; font-size: 11px; text-transform: uppercase; background: var(--secondary); color: var(--white); font-weight: 700; letter-spacing: 0.7px; }
        .request-meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin: 18px 0; }
        .request-meta p { margin: 0; font-size: 14px; line-height: 1.7; }
        .status-update { display: flex; align-items: center; gap: 15px; margin-top: 18px; }
        .status-update label { font-size: 12px; text-transform: uppercase; font-weight: 700; }
        .status-update select { padding: 10px 12px; border: 1px solid #d9dccd; min-width: 180px; }
        .status-update button { background: var(--primary); color: var(--white); border: none; padding: 10px 16px; font-weight: 700; cursor: pointer; }
        .empty-state { display: none; background: #f5f3e8; border: 2px dashed #b5c29f; padding: 32px; text-align: center; color: #476157; font-size: 18px; }
        .logout-button { background: transparent; border: 1px solid var(--secondary); color: var(--text); padding: 10px 18px; cursor: pointer; }
        .logout-button:hover { background: var(--secondary); color: var(--white); }
        @media (max-width: 760px) { .navbar { padding: 0 30px; height: 60px; } .nav-links { gap: 12px; } .nav-links a { font-size: 11px; } .request-meta { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">CareBridge</div>
        <ul class="nav-links">
            <li><a href="doctor-dashboard.html">Dashboard</a></li>
            <li><a href="resources.html">Resources</a></li>
        </ul>
        <button class="logout-button" id="logoutButton" type="button">Logout</button>
    </nav>
    <header class="page-header">
        <h1>Doctor Dashboard</h1>
        <p id="doctorHeading">Review incoming appointments and update their status.</p>
    </header>
    <main class="dashboard-wrap">
        <section class="overview" id="overviewPanel">
            <h2 id="doctorName">Doctor Name</h2>
            <p id="doctorSpecialty">Specialty</p>
        </section>
        <div id="emptyState" class="empty-state">There are no incoming requests for this doctor right now.</div>
        <section id="requestsList" class="request-list"></section>
    </main>
    <script>
        const requestList = document.getElementById('requestsList');
        const emptyState = document.getElementById('emptyState');
        const doctorName = document.getElementById('doctorName');
        const doctorSpecialty = document.getElementById('doctorSpecialty');

        async function ensureDoctorAccess() {
            const me = await fetch('/api/auth/me', { credentials: 'include' });
            if (!me.ok) { window.location.href = 'index.html'; return null; }
            const user = await me.json();
            if (user.role !== 'DOCTOR') { window.location.href = 'patient-home.html'; return null; }
            return user;
        }

        async function loadDoctorDashboard() {
            const user = await ensureDoctorAccess();
            if (!user) return;
            doctorName.textContent = user.name || 'Doctor';
            doctorSpecialty.textContent = 'Doctor dashboard';

            const response = await fetch('/api/doctor/appointments', { credentials: 'include' });
            if (!response.ok) { return; }
            const requests = await response.json();
            if (!requests.length) {
                emptyState.style.display = 'block';
                return;
            }
            emptyState.style.display = 'none';
            requestList.innerHTML = requests.map(item => `
                <article class="request-card" data-id="${item.requestId}">
                    <div class="request-top">
                        <h3>${item.patientName}</h3>
                        <span class="status-pill">${item.status}</span>
                    </div>
                    <div class="request-meta">
                        <p><strong>Consultation reason:</strong> ${item.consultationReason}</p>
                        <p><strong>Preferred date/time:</strong> ${item.preferredDate || 'Not specified'} ${item.preferredTime ? 'at ' + item.preferredTime : ''}</p>
                        <p><strong>Submitted:</strong> ${new Date(item.submittedAt).toLocaleString()}</p>
                        <p><strong>Notes:</strong> ${item.notes || 'No additional notes provided'}</p>
                    </div>
                    <div class="status-update">
                        <label for="status-${item.requestId}">Status</label>
                        <select id="status-${item.requestId}" data-status-select="${item.requestId}">
                            <option value="PENDING" ${item.status === 'PENDING' ? 'selected' : ''}>Pending</option>
                            <option value="ACCEPTED" ${item.status === 'ACCEPTED' ? 'selected' : ''}>Accepted</option>
                            <option value="DECLINED" ${item.status === 'DECLINED' ? 'selected' : ''}>Declined</option>
                            <option value="COMPLETED" ${item.status === 'COMPLETED' ? 'selected' : ''}>Completed</option>
                        </select>
                        <button type="button" data-update-id="${item.requestId}">Update</button>
                    </div>
                </article>
            `).join('');

            document.querySelectorAll('[data-update-id]').forEach(button => {
                button.addEventListener('click', async () => {
                    const id = button.dataset.updateId;
                    const statusValue = document.getElementById('status-' + id).value;
                    const response = await fetch(`/api/appointment-requests/${id}/status`, {
                        method: 'PATCH', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: statusValue })
                    });
                    if (response.ok) { loadDoctorDashboard(); }
                });
            });
        }

        document.getElementById('logoutButton').addEventListener('click', async () => {
            await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
            window.location.href = 'index.html';
        });

        loadDoctorDashboard();
    </script>
</body>
</html>
